<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left accent line -->
  <rect x="80" y="180" width="3" height="270" rx="2" fill="#34d399" opacity="0.6"/>

  <!-- Logo -->
  <text x="112" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="96" font-weight="700" letter-spacing="-2">
    <tspan fill="#34d399">&lt;</tspan><tspan fill="#ffffff">B</tspan><tspan fill="#34d399">/&gt;</tspan>
  </text>

  <!-- Name -->
  <text x="112" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">bbastian.dev</text>

  <!-- Subtitle -->
  <text x="115" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#6b7280" letter-spacing="0.5">Full-Stack Developer · Austria</text>

  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="#34d399" opacity="0.4"/>
</svg>
